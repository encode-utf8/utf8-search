# utf8-search 一键部署：SearXNG（搜索聚合）+ 本服务（MCP + REST）+ Caddy（TLS 反代）
services:
  searxng:
    image: searxng/searxng:latest
    container_name: utf8-search-searxng
    restart: unless-stopped
    volumes:
      # 默认用云端直连配置；本机（中国大陆网络需走代理）在 .env 里指定
      # SEARXNG_SETTINGS_FILE=./searxng/settings.local.yml
      - ${SEARXNG_SETTINGS_FILE:-./searxng/settings.yml}:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=change-me-in-production
    # 让容器内的 host.docker.internal 指向宿主机（本地代理需要；Linux/Windows Docker 均适用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  utf8-search:
    build:
      context: .
      # 国内服务器构建较慢/超时时，把 PIP_INDEX_URL 换成国内镜像源
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: utf8-search-app
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    # 只绑回环：公网只能经由 Caddy 的 443 访问，杜绝裸奔 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - UTF8SEARCH_SEARXNG_URL=http://searxng:8080
      - UTF8SEARCH_API_KEYS=${UTF8SEARCH_API_KEYS:-}
      - UTF8SEARCH_RATE_LIMIT_RPM=${UTF8SEARCH_RATE_LIMIT_RPM:-60}
      - UTF8SEARCH_MCP_ALLOWED_HOSTS=${UTF8SEARCH_MCP_ALLOWED_HOSTS:-}
      # 引擎列表必须显式注入：容器里没有 .env（镜像不打包、compose 也没挂载），
      # 不注入时 Settings 会落到 config.py 的**代码默认值** —— 曾因此踩坑：
      # 代码默认的 default_engines 里还留着已从 SearXNG 删除的 360search（每次空转 ~1s），
      # news_engines 里还留着 sogou wechat（悬空引用，被 SearXNG 静默丢弃）。
      # 值以 .env 为准；这里的 fallback 只是防止 .env 缺项时注入空列表（空 = 交给 SearXNG 默认集合）。
      - UTF8SEARCH_DEFAULT_ENGINES=${UTF8SEARCH_DEFAULT_ENGINES:-resulthunter,yandex,naver,privacywall,google,zapmeta,yahoo,fynd,reloado,yep,brave,quark}
      - UTF8SEARCH_NEWS_ENGINES=${UTF8SEARCH_NEWS_ENGINES:-duckduckgo news,google news,chinaso news,tiger news}
    volumes:
      - ./data:/app/data
    healthcheck:
      # 镜像里没有 curl，用自带 python 探活（/health 恒 200，代表进程与路由可用）
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 反向代理 + 自动 HTTPS：对外只开 80/443，证书由 Caddy 自动申请与续期
  caddy:
    image: caddy:2-alpine
    container_name: utf8-search-caddy
    restart: unless-stopped
    depends_on:
      utf8-search:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # 无域名方案：sslip.io 免费 DNS 会把这个名字解析到 IP 内嵌的地址
      - UTF8SEARCH_DOMAIN=${UTF8SEARCH_DOMAIN:-43.106.104.49.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 账号必须持久化，否则每次重启都重新签发（会撞 Let's Encrypt 配额）
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
