# utf8-search 一键部署：SearXNG（搜索聚合）+ 本服务（MCP + REST）+ Caddy（TLS 反代）
services:
  searxng:
    image: searxng/searxng:latest
    container_name: utf8-search-searxng
    # 自愈：服务器重启或进程崩溃后自动拉起（2026-09-30 复核，三个服务统一）
    restart: unless-stopped
    # 日志轮转：SearXNG 的 WARNING/引擎异常较吵，默认 json-file 不封顶会吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # 默认用云端直连配置；本机（中国大陆网络需走代理）在 .env 里指定
      # SEARXNG_SETTINGS_FILE=./searxng/settings.local.yml
      - ${SEARXNG_SETTINGS_FILE:-./searxng/settings.yml}:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=change-me-in-production
    # 让容器内的 host.docker.internal 指向宿主机（本地代理需要；Linux/Windows Docker 均适用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  utf8-search:
    build:
      context: .
      # 国内服务器构建较慢/超时时，把 PIP_INDEX_URL 换成国内镜像源
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: utf8-search-app
    restart: unless-stopped
    # 日志轮转（同上）：本服务请求日志 + uvicorn 访问日志
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      searxng:
        condition: service_healthy
    # 只绑回环：公网只能经由 Caddy 的 443 访问，杜绝裸奔 8000
    ports:
      - "127.0.0.1:8000:8000"
    # ===== 配置注入（M6 环境接线，方案见 docs/reports/m6-env-wiring-plan-20260930.md）=====
    # env_file：把宿主机 .env 全量注入容器（A 类 60 项产品参数）。镜像里不含 .env，
    #            过去只靠下面 4 条 environment，导致其余设置全部回落 config.py 代码默认值
    #            （曾因此让容器用上已删除的 360search / sogou wechat）。
    env_file:
      - .env
    # environment：显式覆盖/中性化清单。compose 里 environment 优先于 env_file，
    #              而环境变量又优先于 pydantic 的 .env，所以下面这些值不会被 .env 改写。
    environment:
      # --- B 类：容器内地址必须与宿主机不同（宿主机是 127.0.0.1:8888，容器内要连 compose 服务名）
      - UTF8SEARCH_SEARXNG_URL=http://searxng:8080
      # --- A 类中的「服务身份 / 路由契约」：必须显式注入，避免 env_file 缺项时静默回落代码默认值
      - UTF8SEARCH_API_KEYS=${UTF8SEARCH_API_KEYS:-}
      - UTF8SEARCH_RATE_LIMIT_RPM=${UTF8SEARCH_RATE_LIMIT_RPM:-60}
      - UTF8SEARCH_MCP_ALLOWED_HOSTS=${UTF8SEARCH_MCP_ALLOWED_HOSTS:-}
      - UTF8SEARCH_DEFAULT_ENGINES=${UTF8SEARCH_DEFAULT_ENGINES:-resulthunter,yandex,naver,privacywall,google,zapmeta,yahoo,fynd,reloado,yep,brave,quark}
      - UTF8SEARCH_NEWS_ENGINES=${UTF8SEARCH_NEWS_ENGINES:-duckduckgo news,google news,chinaso news,tiger news}
      # --- C 类：宿主机专用键，容器内中性化（不继承宿主机值）
      # 应用不读 SEARXNG_SETTINGS_FILE（Settings 的 extra="ignore"），这里只把它从宿主机路径换成容器路径，避免误导
      - SEARXNG_SETTINGS_FILE=/etc/searxng/settings.yml
      # HOST/PORT 只服务 `utf8-search serve` 子命令；容器用 uvicorn --host/--port 固定值，这里显式写成同一组值
      - UTF8SEARCH_HOST=0.0.0.0
      - UTF8SEARCH_PORT=8000
      # 代理三件套：容器一律直连出网，不继承宿主机（含大陆开发机）的代理设置
      - UTF8SEARCH_TRUST_ENV=false
      - UTF8SEARCH_HTTP_PROXY=
      - UTF8SEARCH_BYPASS_PROXY_HOSTS=
    volumes:
      - ./data:/app/data
    healthcheck:
      # 镜像里没有 curl，用自带 python 探活（/health 恒 200，代表进程与路由可用）
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 反向代理 + 自动 HTTPS：对外只开 80/443，证书由 Caddy 自动申请与续期
  caddy:
    image: caddy:2-alpine
    container_name: utf8-search-caddy
    restart: unless-stopped
    # 日志轮转：Caddyfile 里已经用 roll_size 10MiB / roll_keep 5 管自己的访问日志，
    # 这里再给容器 stdout/stderr 兜一层，避免 docker logs 无上限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      utf8-search:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # 域名：在 .env 里设置 UTF8SEARCH_DOMAIN=<你的域名>（无自有域名可用 <你的IP>.sslip.io）
      - UTF8SEARCH_DOMAIN=${UTF8SEARCH_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 ACME 账号必须持久化，否则每次重启都重新签发（会撞 Let's Encrypt 配额）
      - caddy_data:/data
      - caddy_config:/config

  # 使用说明站：纯静态前端（生成物在 docs/site/，由 scripts/build_docs_site.py 维护）
  # 与 search 服务同栈启动；只绑回环 8080，公网访问由 Caddy 的 /guide/* 反代提供
  docs:
    image: caddy:2-alpine
    container_name: utf8-search-docs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":80"]
    volumes:
      - ./docs/site:/srv:ro
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
