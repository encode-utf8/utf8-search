name: utf8-search
services:
  caddy:
    container_name: utf8-search-caddy
    depends_on:
      utf8-search:
        condition: service_healthy
        required: true
    environment:
      UTF8SEARCH_DOMAIN: 43.106.104.49.sslip.io
    image: caddy:2-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: udp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /root/utf8-search/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: {}
      - type: volume
        source: caddy_data
        target: /data
        volume: {}
      - type: volume
        source: caddy_config
        target: /config
        volume: {}
  searxng:
    container_name: utf8-search-searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: change-me-in-production
    extra_hosts:
      - host.docker.internal=host-gateway
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      timeout: 5s
      interval: 30s
      retries: 3
    image: searxng/searxng:latest
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8888"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /root/utf8-search/searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
        bind: {}
  utf8-search:
    build:
      context: /root/utf8-search
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: https://pypi.org/simple
    container_name: utf8-search-app
    depends_on:
      searxng:
        condition: service_healthy
        required: true
    environment:
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
      UTF8SEARCH_ADVANCED_BUDGET: "5.0"
      UTF8SEARCH_ADVANCED_PAGES: "6"
      UTF8SEARCH_API_KEYS: ***REDACTED***
      UTF8SEARCH_BLOCK_PRIVATE_HOSTS: "true"
      UTF8SEARCH_BYPASS_PROXY_HOSTS: ""
      UTF8SEARCH_CACHE_PAGE_TTL: "21600"
      UTF8SEARCH_CACHE_PATH: data/cache.db
      UTF8SEARCH_CACHE_QUERY_TTL: "600"
      UTF8SEARCH_CACHE_RESULT_TTL: "300"
      UTF8SEARCH_DEEP_BUDGET: "12"
      UTF8SEARCH_DEEP_DOWNLOAD_TIMEOUT: "5"
      UTF8SEARCH_DEEP_EARLY_STOP_RATIO: "0.8"
      UTF8SEARCH_DEEP_PAGE_TIMEOUT: "8"
      UTF8SEARCH_DEEP_PAGES: "24"
      UTF8SEARCH_DEFAULT_ENGINES: resulthunter,yandex,naver,privacywall,google,zapmeta,yahoo,fynd,reloado,yep,brave,quark
      UTF8SEARCH_ENABLE_JINA_FALLBACK: "true"
      UTF8SEARCH_ENGINE_HEALTH_COOLDOWN_CAPTCHA: "1800"
      UTF8SEARCH_ENGINE_HEALTH_COOLDOWN_DENIED: "900"
      UTF8SEARCH_ENGINE_HEALTH_COOLDOWN_MAX: "3600"
      UTF8SEARCH_ENGINE_HEALTH_COOLDOWN_OTHER: "120"
      UTF8SEARCH_ENGINE_HEALTH_COOLDOWN_RATE_LIMIT: "180"
      UTF8SEARCH_ENGINE_HEALTH_COOLDOWN_TIMEOUT: "90"
      UTF8SEARCH_ENGINE_HEALTH_ENABLED: "true"
      UTF8SEARCH_ENGINE_HEALTH_MIN_ACTIVE: "6"
      UTF8SEARCH_ENGINE_HEALTH_PROBE_SLOTS: "0"
      UTF8SEARCH_EXTRACT_BUDGET: "10"
      UTF8SEARCH_EXTRACT_WORKERS: "8"
      UTF8SEARCH_FETCH_EARLY_STOP_RATIO: "0.5"
      UTF8SEARCH_FETCH_MIN_PAGES: "3"
      UTF8SEARCH_FETCH_TIMEOUT: "4.0"
      UTF8SEARCH_GENERAL_RECENCY_INTENT: "true"
      UTF8SEARCH_HOST: 0.0.0.0
      UTF8SEARCH_HTTP_PROXY: ""
      UTF8SEARCH_JINA_FALLBACK_DEPTHS: deep
      UTF8SEARCH_JINA_TIMEOUT: "3"
      UTF8SEARCH_LANGUAGE: all
      UTF8SEARCH_LOG_LEVEL: INFO
      UTF8SEARCH_MAX_FETCH_CONCURRENCY: "24"
      UTF8SEARCH_MAX_REDIRECTS: "5"
      UTF8SEARCH_MCP_ALLOWED_HOSTS: 43.106.104.49:*,43.106.104.49.sslip.io
      UTF8SEARCH_NEWS_CANDIDATE_POOL: "30"
      UTF8SEARCH_NEWS_DATE_BACKFILL: "true"
      UTF8SEARCH_NEWS_DATE_BUDGET: "4.0"
      UTF8SEARCH_NEWS_DATE_PAGES: "16"
      UTF8SEARCH_NEWS_DROP_STALE: "true"
      UTF8SEARCH_NEWS_ENGINES: duckduckgo news,google news,chinaso news,tiger news
      UTF8SEARCH_NEWS_FRESH_DAYS: "7"
      UTF8SEARCH_NEWS_INCLUDE_GENERAL: "true"
      UTF8SEARCH_NEWS_PASS_TIME_RANGE: "false"
      UTF8SEARCH_PAGE_MAX_CHARS: "3000"
      UTF8SEARCH_PAGE_TOTAL_TIMEOUT: "5.0"
      UTF8SEARCH_PORT: "8000"
      UTF8SEARCH_RANK_CANDIDATE_POOL: "24"
      UTF8SEARCH_RANK_DROP_AGGREGATOR_PAGES: "true"
      UTF8SEARCH_RANK_DROP_SCRIPT_MISMATCH: "true"
      UTF8SEARCH_RANK_MAX_PER_HOST: "2"
      UTF8SEARCH_RANK_MIN_QUERY_COVERAGE: "0.34"
      UTF8SEARCH_RATE_LIMIT_RPM: "60"
      UTF8SEARCH_RAW_CONTENT_MAX_CHARS: "20000"
      UTF8SEARCH_REQUEST_TIMEOUT: "8"
      UTF8SEARCH_SAFE_SEARCH: "0"
      UTF8SEARCH_SEARCH_TIMEOUT_LIMIT: "2.5"
      UTF8SEARCH_SEARXNG_URL: http://searxng:8080
      UTF8SEARCH_TRUST_ENV: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health',
          timeout=5).status==200 else 1)
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 20s
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8000
        published: "8000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /root/utf8-search/data
        target: /app/data
        bind: {}
networks:
  default:
    name: utf8-search_default
volumes:
  caddy_config:
    name: utf8-search_caddy_config
  caddy_data:
    name: utf8-search_caddy_data
