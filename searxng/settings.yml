# SearXNG 配置（utf8-search 专用）
# 关键点：开启 json 输出格式（本服务通过 JSON 接口调用），关闭 limiter（内网调用）。
#
# 引擎策略：
#   1) 用官方 keep_only 语法限定候选引擎，避免 SearXNG 默认把大量不可用引擎一起打出去
#      （个别引擎超时会把 worker 打挂，表现为 /search 502）。
#   2) 再用 engines 列表显式 disabled:false 打开需要的引擎（keep_only 只做过滤，
#      不改变引擎自身的默认启用状态）。
#
# 【重要】SearXNG 的 `engines` 查询参数与 `categories` 参数是「叠加」关系而非互斥
#   （源码 searx/webadapter.py: parse_generic）。同时传 categories=news 与
#   engines="google news" 会返回 news 类目下全部引擎的结果，显式列表失去约束力。
#   因此本服务调用时：给了 engines 就不再传 categories（见 providers/searxng.py）。
#   2026-09-24 之前的「逐引擎隔离实测」结论正是因为踩了这个坑而全部不可信，已重测。
#
# 实测结论（2026-09-24，美国出口 IP，8 条中英新闻查询 + 直接读 /config 校验引擎注册）：
#   通用引擎（categories=general，见 engine_list 配置）：
#     稳定可用：resulthunter / yandex / naver / privacywall / google / zapmeta /
#               yahoo / fynd / sogou
#     机会型（可用但会间歇性被限流，失败极快、代价可忽略）：
#               reloado / yep / brave / quark
#   新闻引擎（topic=news 时使用，逐引擎隔离实测，8 条查询口径）：
#     duckduckgo news  93 条结果 / 日期覆盖 100% / 7 日内 48 条 / 1.3s
#                      —— 英文时效性最好，但 3 条纯中文查询返回 0 条
#     sogou wechat     80 条结果 / 日期覆盖 100% / 7 日内 16 条 / 0.4s
#                      —— 8/8 查询均有 10 条，补上 duckduckgo news 的中文盲区，首选中文新闻源
#     google news      84 条结果 / 日期覆盖 0%   / 8/8 查询均有 10 条 / 0.9s
#                      —— 中文覆盖最全但引擎不给发布日期，需靠 URL/页面回补日期
#   已实测剔除（不再注册，避免白白增加延迟与 unresponsive 噪音）：
#     bing news（8/8 查询 0 条）、reuters（43 条但 7 日内 0 条，且不支持中文）、
#     brave.news（Suspended: too many requests）、
#     yahoo news / mojeek news / startpage news（镜像内 inactive 或未注册，
#     用 engines 参数点名会被静默丢弃，反而回落到全部通用引擎）、
#     wikinews（日期停留在 2024 年）
#
# 2026-09-28 引擎集合替换（M6 阶段 2，证据见 docs/reports/m6-engine-swap-20260929.md）：
#   移除 360search：6 条中文本地化查询 0 结果，且**每次空转 ~1s**（不是快速失败），
#                   它一个人把「默认集合查询」的 P50 抬到 1s 级；移除后结果数不减、P50 −33%。
#   移除 sogou wechat：同一批查询 0 结果（150ms 空转）。5.2 定它为首选中文新闻源时是
#                   2026-09-24 的**美国出口**；现出口（新加坡）它已失效，中文新闻改由下面两个补。
#   新增 chinaso news：6 条中文查询 24 条结果、**100% 带发布日期**（286ms）。
#                   5.3 曾因本镜像「The "engine" field is missing」注册失败而排除，
#                   2026-09-28 在探针实例复核确认可注册（需显式 inactive: false）。
#   新增 tiger news：同批 60 条结果、**100% 带发布日期**（250ms），中文新闻候选的备选。
#   本轮不加 sina（无发布日期，对时效无帮助）与 bilibili（视频站，单站会灌满候选池）。
#   保留 7-18ms 快速失败的引擎（resulthunter/privacywall/yep/brave/quark）：它们成本可忽略。
#   通用类目不可用：bing（返回 0）、duckduckgo（CAPTCHA）、google cse（unusual traffic）、
#           qwant（CAPTCHA）、baidu（CAPTCHA）、seznam（timeout）、
#           mojeek 与 startpage（本镜像标记 inactive，需 Proof-of-Work 验证码）
use_default_settings:
  engines:
    keep_only:
      - resulthunter
      - yandex
      - naver
      - privacywall
      - google
      - zapmeta
      - yahoo
      - fynd
      - reloado
      - yep
      - brave
      - quark
      - "duckduckgo news"
      - "google news"
      # 中文补充源（2026-09-28 实测采用，替换已失效的 360search / sogou wechat）：
      # 两者均为 news 类目，中文查询带发布日期比例 100%，对 5.2 时效判定有直接帮助。
      # 实测已排除：baidu（CAPTCHA，suspended_time=3600）、bilibili（单站 20 条视频会淹没结果集）、
      #             sina（无发布日期，只增候选宽度不增时效）
      - "chinaso news"
      - "tiger news"

general:
  debug: false
  instance_name: "utf8-search"
  # 打开 OpenMetrics（/metrics）：本服务用它读取每个引擎的延迟分位数与成功率，
  # 作为「引擎健康度自适应」的权威数据源。密码用于 basic auth（用户名任意）。
  enable_metrics: true
  open_metrics: "utf8-search-metrics"

server:
  secret_key: "change-me-in-production"
  limiter: false
  public_instance: false
  image_proxy: false
  http_protocol_version: "1.1"

search:
  safe_search: 0
  # 中英兼顾：不限语言；如需偏中文可改为 zh-CN
  default_language: "all"
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

# 出网超时：默认 3s 会让略慢的引擎超时，而引擎超时在 SearXNG 中可能触发
# 「ResultContainer 已关闭后仍上报引擎不可用」的异常并把 worker 打挂（表现为 502）。
# 这里放宽到 8s / 15s，实测可显著减少 502。
outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

# 显式启用引擎
engines:
  - name: resulthunter
    disabled: false
  - name: yandex
    disabled: false
  - name: naver
    disabled: false
  - name: privacywall
    disabled: false
  - name: google
    disabled: false
  - name: zapmeta
    disabled: false
  - name: yahoo
    disabled: false
  - name: fynd
    disabled: false
  - name: reloado
    disabled: false
  - name: yep
    disabled: false
  - name: brave
    disabled: false
  - name: quark
    disabled: false
  - name: "duckduckgo news"
    disabled: false
  - name: "google news"
    disabled: false
  # inactive 引擎必须显式覆盖，否则 keep_only 也不会把它注册进来（5.3 踩过的坑）
  - name: "chinaso news"
    disabled: false
    inactive: false
  - name: "tiger news"
    disabled: false
    inactive: false
